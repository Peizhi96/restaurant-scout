x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_scout}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurant_scout_dev}
    ports:
      - "5432:5432"
    volumes:
      - restaurant_scout_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *service-logging

  api:
    build:
      context: ./backend
    environment:
      <<: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    logging: *service-logging

  frontend:
    build:
      context: ./frontend
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      APP_ENV: ${APP_ENV:-development}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-dev-only-change-me}
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:-}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:-}
      OPERATOR_ID: ${OPERATOR_ID:-local-operator}
      CANDIDATE_MIN_COMPLETENESS: ${CANDIDATE_MIN_COMPLETENESS:-40}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - api
    logging: *service-logging

  scheduler:
    profiles: ["scheduler"]
    build:
      context: ./backend
    environment:
      <<: *app-environment
    depends_on:
      api:
        condition: service_started
    command: ["python", "-m", "app.jobs.scheduler"]
    restart: unless-stopped
    logging: *service-logging

  test:
    profiles: ["validation"]
    build:
      context: ./backend
      target: test
    volumes:
      - ./backend:/app
    command: ["sh", "-c", "ruff check . && pytest"]
    logging: *service-logging

volumes:
  restaurant_scout_postgres:
