x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://restaurant_scout:restaurant_scout_dev@db:5432/restaurant_scout}
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DEDUP_AUTO_MATCH_THRESHOLD: ${DEDUP_AUTO_MATCH_THRESHOLD:-0.90}
  DEDUP_REVIEW_THRESHOLD: ${DEDUP_REVIEW_THRESHOLD:-0.72}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-dev-only-change-me}
  RESTAURANT_REALTY_ENABLED: ${RESTAURANT_REALTY_ENABLED:-false}
  RESTAURANT_REALTY_SITE_URL: ${RESTAURANT_REALTY_SITE_URL:-https://restaurantrealty.com}
  RESTAURANT_REALTY_API_URL: ${RESTAURANT_REALTY_API_URL:-https://api.restaurantrealty.verticacrm.com/api/bbcrmapi}
  RESTAURANT_REALTY_TIMEOUT_SECONDS: ${RESTAURANT_REALTY_TIMEOUT_SECONDS:-20}
  RESTAURANT_REALTY_REQUEST_DELAY_SECONDS: ${RESTAURANT_REALTY_REQUEST_DELAY_SECONDS:-0.5}
  RESTAURANT_REALTY_USER_AGENT: ${RESTAURANT_REALTY_USER_AGENT:-RestaurantScout/0.1}
  RESTAURANT_REALTY_TARGET_CITIES: ${RESTAURANT_REALTY_TARGET_CITIES:-San Mateo,San Carlos,Redwood City,Palo Alto,Mountain View,Sunnyvale}
  RESTAURANT_REALTY_TARGET_COUNTIES: ${RESTAURANT_REALTY_TARGET_COUNTIES:-San Mateo County,Santa Clara County}
  REMOVAL_MISSING_SCAN_THRESHOLD: ${REMOVAL_MISSING_SCAN_THRESHOLD:-2}
  SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-86400}
  SCHEDULER_INITIAL_DELAY_SECONDS: ${SCHEDULER_INITIAL_DELAY_SECONDS:-60}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_scout}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurant_scout_dev}
    ports:
      - "5432:5432"
    volumes:
      - restaurant_scout_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      <<: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  scheduler:
    profiles: ["scheduler"]
    build:
      context: ./backend
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.jobs.scheduler"]
    restart: unless-stopped

  test:
    profiles: ["validation"]
    build:
      context: ./backend
      target: test
    volumes:
      - ./backend:/app
    command: ["sh", "-c", "ruff check . && pytest"]

volumes:
  restaurant_scout_postgres:
