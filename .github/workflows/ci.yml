name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e '.[dev]'
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: e2e (Selenium)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Throwaway values for the CI stack only; compose passes them to the API and frontend.
      INTERNAL_API_KEY: e2e-only-internal-api-key-not-a-secret
      APP_AUTH_USERNAME: e2e-operator
      APP_AUTH_PASSWORD: e2e-only-password
      FRONTEND_PORT: "3001"
      E2E_BASE_URL: http://localhost:3001
      E2E_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and start PostgreSQL, API, and dashboard images
        run: docker compose up --build --detach db api frontend
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: e2e
      - run: ruff check .
        working-directory: e2e
      - name: Run Selenium suite (headless Chrome)
        run: pytest -v
        working-directory: e2e
      - name: Collect service logs
        if: failure()
        run: mkdir -p e2e/artifacts && docker compose logs --no-color > e2e/artifacts/compose.log
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: e2e/artifacts
          retention-days: 7
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
